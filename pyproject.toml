[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm"
version = "0.1.0"
description = "A 300M-parameter language model trained from scratch, built to survive preemption"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "regex>=2023.0",
    "tqdm>=4.65",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
data = ["datasets>=2.18", "zstandard>=0.22"]
cloud = ["boto3>=1.34", "huggingface_hub>=0.23"]
track = ["wandb>=0.17"]
all = ["slm[dev,data,cloud,track]"]

[project.scripts]
slm-train = "slm.cli:train_main"
slm-eval = "slm.cli:eval_main"
slm-generate = "slm.cli:generate_main"
slm-chat = "slm.cli:chat_main"

[tool.setuptools.packages.find]
include = ["slm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::UserWarning:torch.nn.attention.flex_attention"]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLC", "RUF"]
# PLC0415: optional deps (boto3, huggingface_hub, datasets, wandb) are imported
# lazily on purpose so the core package installs with four dependencies.
# B905: zip(strict=) changes behaviour where lengths intentionally differ.
# SIM105: these try/except/pass blocks carry a comment explaining what is being
# swallowed and why; contextlib.suppress would displace it.
ignore = ["E501", "B008", "RUF012", "PLC0415", "B905", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "SIM117"]
