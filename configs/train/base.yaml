# shared training defaults; see docs/ARCHITECTURE.md sections 3 and 5
data:
  train_dir: data/tokens/train
  val_dir: data/tokens/val
  seed: 1337
  num_workers: 1
optim:
  kind: muon
  lr: 6.0e-4
  muon_lr: 0.02
  min_lr_ratio: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: wsd
  warmup_steps: 2000
  decay_shape: 1-sqrt
  zloss: 1.0e-4
train:
  out_dir: runs
  seed: 1337
  global_batch_tokens: 524288
  micro_batch_size: 8
  dtype: bfloat16
  compile: true
  log_every: 10
  eval_every: 500
  eval_steps: 50
  resume: auto
ckpt:
  interval: 1000
  keep_last: 2
  permanent_every: 10000
  async_save: true
  verify_hash: true
